name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy pandas matplotlib cvxpy pytest
      - run: python -m pytest tests -q
        env:
          CARBONFARM_SOLVER: highs
